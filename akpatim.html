<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AkPatim · Akbank Mobil (konsept prototip)</title><style>:root{--red:#DC0005;--red-top:#E3393E;--red-l:#FDEBEC;--bg:#F2F2F5;--ink:#1C1C1E;--body:#3A3A3C;--muted:#727278;--line:#E6E6EA;--yellow:#FFB400;--yellow-top:#FFBF2E;--dark:#38393D;--dark-top:#55565B;--green:#1E9E5A;--green-l:#E6F5EC;--gold:#E7A800}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#E9E9EE;font-family:Figtree,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}
/* jüri paneli */
#jury{width:300px;display:flex;flex-direction:column;gap:14px;font-size:14px;color:var(--body)}
#jury h1{font-size:22px;margin:0;color:var(--ink)}
#jury p{margin:0;line-height:1.5}
#jury .jb{display:flex;flex-direction:column;gap:8px}
#jury button{text-align:left;border:1px solid #D5D5DB;background:#fff;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;cursor:pointer}
#jury button:hover{border-color:var(--red);color:var(--red)}
#jury small{color:var(--muted)}
/* cihaz */
.device{width:402px;height:860px;border-radius:58px;background:#111;padding:12px;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);position:relative;flex:none}
.device::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:20px;background:#000;z-index:50}
#app{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--bg)}
@media (max-width:760px){#jury{display:none}#stage{padding:8px;gap:0}}@media (max-width:500px) and (pointer:coarse){#stage{padding:0;display:block}#jury{display:none}.device{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}.device::before{display:none}#app{border-radius:0}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr.enter{animation:slideIn .28s cubic-bezier(.2,.8,.2,1)}
.scr.enterBack{animation:slideBack .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
/* durum çubuğu */
.sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px 38px;font-weight:700;font-size:16px;color:#fff;flex:none}
.sb .ic{display:flex;gap:6px;align-items:center}
/* ana başlık */
.hh{background:var(--red-top);color:#fff;flex:none}
.hh.yellow{background:var(--yellow-top)}.hh.dark{background:var(--dark-top)}
.asr{display:flex;align-items:center;gap:12px;padding:6px 18px 12px}
.asr .lg{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.asr .tx{flex:1;font-size:15px;line-height:1.35;cursor:pointer}.asr .tx span{opacity:.85}.asr .tx b{font-weight:700}
.bellb{width:40px;height:40px;border:none;background:none;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.bellb i{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--red-top)}
.avt{width:40px;height:40px;border-radius:50%;background:#F1F1F3;color:var(--red);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;border:none}
.ttabs{display:flex;gap:2px;overflow-x:auto;padding:4px 10px 12px;scrollbar-width:none;background:var(--red)}
.ttabs::-webkit-scrollbar{display:none}
.hh.yellow .ttabs{background:var(--yellow)}.hh.dark .ttabs{background:var(--dark)}
.ttabs button{flex:none;border:none;background:none;color:#fff;font-size:16px;font-weight:500;padding:9px 14px;border-radius:999px;cursor:pointer}
.ttabs button.on{background:rgba(255,255,255,.22);font-weight:700}
.hero{background:var(--red);color:#fff;padding:14px 20px 56px;text-align:center}
.hero.yellow{background:var(--yellow)}.hero.dark{background:var(--dark)}
.hero .lab{font-size:13px;letter-spacing:.06em;opacity:.9;margin-top:6px}
.hero .big{font-size:42px;font-weight:700;margin:6px 0 10px}.hero .big small{font-size:28px;opacity:.75;font-weight:600}
.hero .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
.acts button{border:none;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:1.2;cursor:pointer}
.acts button span.c{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.search{margin:-28px 16px 16px;position:relative;z-index:2;background:#fff;border-radius:999px;height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;color:#9A9AA0;font-size:16px;box-shadow:0 6px 18px -8px rgba(0,0,0,.18)}
.ghero{background:var(--red);color:#fff;padding:18px 20px 64px;position:relative;overflow:hidden}
.ghero h2{font-size:28px;line-height:1.25;margin:4px 0 26px;font-weight:700;max-width:300px}
.ghero .row{display:flex;gap:10px;align-items:center}
.obtn{border:2px solid #fff;background:none;color:#fff;border-radius:999px;padding:11px 22px;font-size:16px;font-weight:700;cursor:pointer}
.ghero .like{width:52px;height:52px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.ghero .art{position:absolute;right:-6px;bottom:6px;width:150px;opacity:.95}
/* sayfa başlığı */
.ph{background:var(--red);color:#fff;flex:none}
.ph .sb{background:var(--red)}
.ph .row{display:flex;align-items:center;height:56px;padding:0 12px;position:relative}
.ph .row h1{position:absolute;left:56px;right:56px;text-align:center;font-size:19px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .row .bk,.ph .row .rt{width:44px;height:44px;border:none;background:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ph .row .rt{margin-left:auto}
/* kartlar */
.wrap{padding:0 16px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cpad{padding:18px}
.sec{font-size:13px;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:12px 4px 2px;text-transform:uppercase}
.list .it{display:flex;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-bottom:none;width:100%;text-align:left;font-size:17px}
.list .it:first-child{border-top:none}
.list .it .t{flex:1;font-weight:500}
.list .it .t small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.ico{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;flex:none;color:var(--red)}
.ico.sm{width:40px;height:40px;box-shadow:none;background:#F4F4F6}
.new{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;margin-left:8px;vertical-align:middle;letter-spacing:.03em}
.katil{display:inline-block;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:4px;letter-spacing:.04em}
.lbtn{width:100%;border:2px solid var(--red);background:#fff;color:var(--red);border-radius:999px;min-height:52px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn{width:100%;border:none;background:var(--red);color:#fff;border-radius:999px;min-height:54px;font-size:17px;font-weight:700;cursor:pointer}
.pbtn:disabled{background:#F5A3A5;cursor:not-allowed}
.link{color:var(--red);font-weight:700;text-decoration:underline;background:none;border:none;padding:0;font-size:15px;cursor:pointer}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.carousel>*{scroll-snap-align:start;flex:none}
.acc{display:flex;gap:14px;padding:18px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.acc:first-child{border-top:none}
.acc .lgA{width:40px;height:40px;border-radius:50%;flex:none}
.acc .t{flex:1;font-size:15px;color:var(--body);line-height:1.45}
.acc .t b{display:block;font-size:17px;color:var(--ink)}
.dots{width:36px;height:36px;border:none;background:none;cursor:pointer;color:var(--ink)}
.chd{display:flex;justify-content:space-between;align-items:center;padding:18px;border-bottom:1px solid var(--line)}
.chd h3{margin:0;font-size:19px;font-weight:600}
.chd .ct{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:16px}
.chd .ct i{width:32px;height:32px;border-radius:50%;background:#F1F1F3;display:flex;align-items:center;justify-content:center;font-style:normal}
.m{font-weight:700}.m .d{font-weight:600;color:inherit;opacity:.7;font-size:.82em}
.tile{width:150px;height:200px;background:#E9E9EC;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:none;text-align:left}
.tile b{font-size:17px;font-weight:600;line-height:1.3}
.tile .ill{align-self:center}
/* alt menü */
.tabbar{flex:none;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px 26px}
.tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;color:#55555A;cursor:pointer;flex:1}
.tabbar button.on{color:var(--red);font-weight:600}
/* senin için */
.stories{display:flex;gap:14px;overflow-x:auto;padding:16px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;text-align:center;cursor:pointer;background:none;border:none;color:var(--ink);line-height:1.25}
.story .ring{width:72px;height:72px;border-radius:50%;padding:3px;background:conic-gradient(var(--red),#FFB000,var(--red))}
.story .in{width:100%;height:100%;border-radius:50%;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--red);font-weight:700;font-size:11px}
.story .in img{width:100%;height:100%;object-fit:cover}
.dash{border:2px dashed #CFCFD5;border-radius:18px;background:linear-gradient(180deg,#F7F7F9,#EDEDF0);padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-height:210px;position:relative}
.dash h3{margin:0;font-size:19px;font-weight:700}
.dash p{margin:0;font-size:14.5px;color:var(--body);line-height:1.4}
.dash .add{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:700;text-decoration:underline;font-size:16px}
.bub{display:flex;margin:4px 0}.bub span{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15);margin-left:-8px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--red)}
.bub span:first-child{margin-left:0}
/* Petim */
.pethd{background:var(--red);color:#fff;padding:14px 18px 60px}
.pets{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.pets::-webkit-scrollbar{display:none}
.petc{flex:none;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(255,255,255,.18);border:2px solid transparent;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.petc.on{background:#fff;color:var(--red)}
.petc img,.petc .pi{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--red)}
.kcard{margin:-44px 16px 0;position:relative;z-index:2}
.prog{height:10px;border-radius:999px;background:#F1F1F3;overflow:hidden}.prog b{display:block;height:100%;background:var(--red);border-radius:999px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qgrid button{background:#fff;border:none;border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04);line-height:1.2}
.qgrid button span.c{width:44px;height:44px;border-radius:50%;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center}
.env{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.env:first-child{border-top:none}
.env i{width:12px;height:12px;border-radius:4px}
.env .bar{grid-column:2/4;height:6px;border-radius:999px;background:#F1F1F3;overflow:hidden;margin-top:-4px}.env .bar b{display:block;height:100%}
.tx{display:flex;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.tx:first-child{border-top:none}
.tx .ci{width:44px;height:44px;border-radius:50%;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.tx .t{flex:1;line-height:1.35}.tx .t b{display:block;font-size:16px}.tx .t small{color:var(--muted);font-size:13.5px}
.tx .a{text-align:right;font-weight:700;font-size:16px}.tx .a small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.pos{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid #D9D9DE;background:#fff;border-radius:999px;padding:10px 18px;font-size:16px;cursor:pointer}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}
.fq{font-size:18px;font-weight:600;margin:6px 0 12px}
.inp{width:100%;min-height:54px;border:1.5px solid #D9D9DE;border-radius:14px;padding:0 16px;font-size:17px;font-family:inherit;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--red)}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer;color:var(--body)}
.ck input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red);flex:none}
.ck a{color:var(--red);font-weight:600}
.info{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:16px;font-size:15px;line-height:1.45;color:var(--body)}
.info .ii{width:28px;height:28px;border-radius:50%;background:#9A9AA0;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:15px}
.aibox{background:linear-gradient(135deg,#FFF5F5,#FFFFFF);border:1.5px solid #F6C9CA;border-radius:18px;padding:16px;display:flex;gap:12px;font-size:15px;line-height:1.5}
.aibox .lgx{flex:none}
.sw{width:52px;height:32px;border-radius:999px;background:#D5D5DB;position:relative;border:none;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--green)}.sw.on::after{left:23px}
.radio{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-top:1px solid var(--line);cursor:pointer}
.radio:first-child{border-top:none}
.radio .r{width:24px;height:24px;border-radius:50%;border:2px solid #C7C7CC;flex:none;margin-top:2px;position:relative}
.radio.on .r{border-color:var(--red)}.radio.on .r::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--red)}
.radio .t{flex:1;line-height:1.4}.radio .t b{display:block;font-size:16px}.radio .t small{color:var(--muted);font-size:14px}
.sumrow{display:flex;justify-content:space-between;gap:16px;padding:15px 18px;border-top:1px solid var(--line);font-size:15.5px}
.sumrow:first-child{border-top:none}.sumrow span{color:var(--muted)}.sumrow b{text-align:right}
/* tuş takımı */
.amt{text-align:center;padding:26px 16px 10px}
.amt .lab{color:var(--muted);font-size:15px}
.amt .v{font-size:46px;font-weight:700;margin:8px 0 4px;min-height:56px}
.amt .v small{font-size:28px;color:var(--muted);font-weight:600}
.amt .hint{font-size:14px;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px}
.keys button{height:58px;border:none;background:#fff;border-radius:14px;font-size:24px;font-weight:600;cursor:pointer}
.keys button:active{background:#EDEDF0}
.qamt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
.qamt button{border:1.5px solid #D9D9DE;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
/* kampanya */
.camp{background:#fff;border-radius:18px;overflow:hidden;cursor:pointer}
.camp .img{height:150px;position:relative;display:flex;background:linear-gradient(90deg,var(--red) 0 48%,#F6EFE8 48%)}
.camp .img .art{position:absolute;right:16px;bottom:10px}
.camp .badge{position:absolute;top:14px;left:14px;display:flex;align-items:center;gap:6px;background:#C6672F;color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:4px 12px 4px 4px}
.camp .badge i{width:28px;height:28px;border-radius:50%;background:#D98A55;display:flex;align-items:center;justify-content:center}
.camp .yeni{position:absolute;left:14px;bottom:-1px;background:var(--red);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:4px 4px 0 0}
.camp .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.camp .b h3{margin:0;font-size:18px;font-weight:600;line-height:1.35}
.fchips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:none;background:#fff;border-radius:999px;padding:10px 18px;font-size:15px;cursor:pointer}
.fchips button.on{background:var(--red);color:#fff;font-weight:600}
.lvl{display:flex;align-items:center;justify-content:space-between;position:relative;margin:18px 4px 6px}
.lvl::before{content:"";position:absolute;left:18px;right:18px;top:18px;height:3px;background:#E3E3E8}
.lvl .fill{position:absolute;left:18px;top:18px;height:3px;background:var(--red)}
.lvl .n{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted);z-index:1;width:70px}
.lvl .n span{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #DCDCE1;display:flex;align-items:center;justify-content:center}
.lvl .n.on span{border-color:var(--red);color:var(--red)}.lvl .n.on{color:var(--ink);font-weight:700}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.task .t{flex:1;font-size:15.5px;line-height:1.35}.task .t small{display:block;color:var(--muted);font-size:13px}
.task .v{font-weight:700}
.trophy{width:120px;height:120px;border-radius:50%;background:#F1F1F3;display:flex;align-items:center;justify-content:center;margin:6px auto}
.code{display:inline-flex;align-items:center;gap:16px;background:#F1F1F3;border-radius:8px;padding:12px 18px;font-size:17px;letter-spacing:.06em;cursor:pointer;border:none}
/* kamera */
.cam{background:#111;position:absolute;inset:0;display:flex;flex-direction:column;color:#fff}
.cam .vf{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3b3b3f,#101012)}
.paper{width:250px;background:#FCFBF7;color:#222;border-radius:4px;padding:16px;font-family:'Courier New',monospace;font-size:11px;line-height:1.55;transform:rotate(-3deg);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.paper b{font-size:12px}
.corner{position:absolute;width:44px;height:44px;border:4px solid #fff}
.scanl{position:absolute;left:12%;right:12%;height:3px;background:linear-gradient(90deg,transparent,#31E08A,transparent);box-shadow:0 0 18px 4px rgba(49,224,138,.55);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{top:22%}50%{top:76%}}
.cam .ctl{padding:20px 20px 38px;display:flex;flex-direction:column;align-items:center;gap:16px}

.segs{display:flex;gap:8px}.segs button{border:none;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;cursor:pointer}.segs button.on{background:#fff;color:#111;font-weight:700}
/* alt sayfalar ve bildirimler */

.sheet .grab{width:44px;height:5px;border-radius:999px;background:#D5D5DB;margin:10px auto 0}
.sheet .sx{display:flex;justify-content:flex-end;padding:8px 14px 0}
.sheet .sx button{width:40px;height:40px;border:none;background:none;cursor:pointer}
.sheet .sbody{overflow-y:auto;padding:4px 20px 26px;scrollbar-width:none}

.chat{display:flex;flex-direction:column;gap:10px;padding:10px 0}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:6px}

.sugs{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.sugs button.r{color:var(--red);font-weight:600}
.chatin{display:flex;gap:10px;align-items:center;padding:12px 16px 30px;border-top:1px solid var(--line)}
.chatin input{flex:1;min-height:48px;border:none;background:#F2F2F5;border-radius:999px;padding:0 18px;font-size:16px;font-family:inherit}
#push{position:absolute;top:50px;left:10px;right:10px;z-index:60;background:rgba(250,250,252,.97);border-radius:22px;padding:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);display:flex;gap:12px;cursor:pointer;animation:drop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#push .pt{flex:1;font-size:14.5px;line-height:1.4}#push .pt b{display:flex;justify-content:space-between;font-size:14px}#push .pt b small{font-weight:400;color:var(--muted)}
#push .pa{display:flex;gap:8px;margin-top:10px}#push .pa button{flex:1;border:none;border-radius:12px;padding:9px;font-weight:700;font-size:14px;cursor:pointer;background:#E9E9EE}#push .pa button.y{background:var(--red);color:#fff}
#toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:70;background:#2C2C2E;color:#fff;border-radius:14px;padding:13px 16px;font-size:14.5px;line-height:1.4;animation:fade .2s}
.ok{width:84px;height:84px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;margin:12px auto}
.center{text-align:center}
.muted{color:var(--muted)}
.empty{padding:20px;color:var(--muted);text-align:center}

/* ===== v2 eklemeler ===== */
html,body{background:#ECECF1}
#stage{gap:48px;min-height:100vh}
.devwrap{flex:none;transform-origin:center center}
#jury{width:310px}

#jury .grp{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:6px}
#jury button{display:flex;gap:10px;align-items:center}
#jury button .n{width:24px;height:24px;border-radius:50%;background:var(--red-l);color:var(--red);font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none}
#jury button.on{border-color:var(--red);background:var(--red-l)}
/* geçişler: yalnızca gezinmede */
.scr.enter{animation:slideIn .32s cubic-bezier(.2,.8,.2,1) both}
.scr.enterBack{animation:slideBack .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideIn{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideBack{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.fx>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.fx>*:nth-child(2){animation-delay:.05s}.fx>*:nth-child(3){animation-delay:.1s}.fx>*:nth-child(4){animation-delay:.15s}.fx>*:nth-child(5){animation-delay:.2s}.fx>*:nth-child(6){animation-delay:.25s}.fx>*:nth-child(7){animation-delay:.3s}.fx>*:nth-child(n+8){animation-delay:.34s}
.still .fx>*{animation:none}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
/* Pati */
.pati{display:inline-block;flex:none}
.pati svg{display:block;overflow:visible}
.pati .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 90%}
.pati .eye{animation:blink 4.6s infinite;transform-origin:center;transform-box:fill-box}
.pati .tail{animation:wag 1.6s ease-in-out infinite;transform-origin:20% 80%;transform-box:fill-box}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.phead{background:var(--red);color:#fff;padding:6px 18px 66px;position:relative;overflow:hidden}
.phead .say{display:flex;gap:12px;align-items:flex-end}
.phead .bubble{background:#fff;color:var(--ink);border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:15px;line-height:1.42;box-shadow:0 8px 20px -10px rgba(0,0,0,.35);animation:pop .45s .1s cubic-bezier(.2,1.4,.4,1) both}
.phead .bubble b{color:var(--red)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.phead .deco{position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
/* kumbara kartı */
.kc2{margin:-50px 16px 0;position:relative;z-index:2;background:#fff;border-radius:22px;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);overflow:hidden}
.kc2 .top{padding:18px 18px 14px;display:flex;gap:14px;align-items:center}
.kc2 .lab{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.kc2 .bal{font-size:32px;font-weight:700;margin:2px 0}
.kc2 .sub{font-size:13.5px;color:var(--muted)}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:20px;line-height:1}
.ring .v small{font-size:10px;font-weight:600;color:var(--muted);margin-top:3px;letter-spacing:.03em}
.flow{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line)}
.flow div{padding:12px 10px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.35}
.flow div+div{border-left:1px solid var(--line)}
.flow b{display:block;font-size:15.5px;color:var(--ink)}
.flow .in b{color:var(--green)}.flow .out b{color:var(--red)}
/* öneri kartları */
.sug{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border:1.5px solid transparent;transition:all .3s}
.sug .hd{display:flex;gap:12px;align-items:flex-start}
.sug .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.sug .tt{flex:1;font-size:15px;line-height:1.45;color:var(--body)}
.sug .tt b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.sug .tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--red);display:flex;gap:6px;align-items:center}
.sug .bt{display:flex;gap:8px}
.sug .bt button{flex:1;min-height:44px;border-radius:999px;font-weight:700;font-size:14.5px;cursor:pointer;border:1.5px solid #D5D5DB;background:#fff;color:var(--ink)}
.sug .bt button.y{background:var(--red);border-color:var(--red);color:#fff}
.sug.done{border-color:#BFE6CF;background:#F6FCF8}
.sug .ok2{display:flex;gap:10px;align-items:center;color:var(--green);font-weight:700;font-size:14.5px}
.sec2{display:flex;justify-content:space-between;align-items:center;margin:8px 4px 0}
.sec2 h3{margin:0;font-size:18px;font-weight:700}
.sec2 .link{font-size:14px}
/* dostlar */
.petrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.petrow::-webkit-scrollbar{display:none}
.petcard{flex:none;width:150px;background:#fff;border-radius:18px;padding:14px;cursor:pointer;border:none;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.petcard .nm{font-weight:700;font-size:16px}
.petcard .k{font-size:12.5px;color:var(--muted)}
.petcard .nx{font-size:12.5px;line-height:1.35;color:var(--body);background:#F6F6F8;border-radius:10px;padding:7px 9px;margin-top:4px}
.petcard.add{border:2px dashed #D5D5DB;background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--red);font-weight:700;gap:8px}
.av{border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--red-l)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{background:#fff;border:none;border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.2;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qa button .c{width:42px;height:42px;border-radius:50%;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center}
.ask{position:sticky;bottom:0;z-index:5;padding:10px 16px 14px;background:linear-gradient(180deg,rgba(242,242,245,0),var(--bg) 35%)}
.ask button{width:100%;display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid #F2C4C5;border-radius:999px;padding:6px 8px 6px 6px;font-size:15px;color:var(--muted);cursor:pointer;box-shadow:0 8px 20px -12px rgba(220,0,5,.45)}
.ask button span.t{flex:1;text-align:left}
.ask button .mic{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
/* hareketler */
.sumbar{background:#fff;border-radius:18px;display:grid;grid-template-columns:1fr 1fr 1fr;overflow:hidden}
.sumbar div{padding:14px 8px;text-align:center;font-size:12px;color:var(--muted);line-height:1.35}
.sumbar div+div{border-left:1px solid var(--line)}
.sumbar b{display:block;font-size:16px;color:var(--ink);margin-top:2px}
.row2{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.row2:first-child{border-top:none}
.row2 .ci{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.row2 .ci.in{background:var(--green-l);color:var(--green)}
.row2 .ci.out{background:var(--red-l);color:var(--red)}
.row2 .ci.card{background:#FFF4D6;color:#B07B00}
.row2 .t{flex:1;line-height:1.35;min-width:0}
.row2 .t b{display:block;font-size:15.5px}
.row2 .t small{color:var(--muted);font-size:13px}
.row2 .a{text-align:right;font-weight:700;font-size:15.5px;white-space:nowrap}
.row2 .a small{display:block;font-weight:600;font-size:11.5px;margin-top:3px}
.badge2{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.b-in{background:var(--green-l);color:var(--green)}.b-out{background:var(--red-l);color:var(--red)}.b-card{background:#FFF4D6;color:#9A6B00}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:0 4px}
.legend span{display:flex;gap:6px;align-items:center}
/* plan grafiği */
.bars{display:flex;align-items:flex-end;gap:5px;height:130px;padding:8px 2px 0}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10.5px;color:var(--muted)}
.bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bars .b i.k{background:var(--red)}.bars .b i.r{background:#F3B7B8}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.why{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--body);padding:10px 0;border-top:1px solid var(--line)}
.why:first-child{border-top:none}
.why .d{width:28px;height:28px;border-radius:9px;background:var(--red-l);color:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
/* ödeme anı */
.opt{display:flex;gap:12px;padding:16px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
.opt:first-child{border-top:none}
.opt .r{width:24px;height:24px;border-radius:50%;border:2px solid #C7C7CC;flex:none;margin-top:2px;position:relative}
.opt.on .r{border-color:var(--red)}.opt.on .r::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--red)}
.opt .t{flex:1;line-height:1.42;font-size:14px;color:var(--body)}
.opt .t b{display:block;font-size:16px;color:var(--ink)}
.rec{display:inline-block;background:var(--green);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;margin-left:6px;letter-spacing:.04em;vertical-align:2px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.meter .tr{flex:1;height:8px;border-radius:999px;background:#EEE;overflow:hidden;position:relative}
.meter .tr b{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .6s}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:#C9C9CF;animation:tp 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.steps{display:flex;flex-direction:column;gap:12px}
.steps .s{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--muted);transition:color .3s}
.steps .s .d{width:28px;height:28px;border-radius:50%;border:2px solid #D5D5DB;display:flex;align-items:center;justify-content:center;flex:none;transition:all .3s}
.steps .s.on{color:var(--ink)}.steps .s.on .d{background:var(--green);border-color:var(--green)}
.seg{display:flex;background:#E7E7EC;border-radius:14px;padding:4px}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.donecheck{width:88px;height:88px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;margin:14px auto 4px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.donecheck path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp div{background:#fff;border-radius:16px;padding:14px;font-size:13px;color:var(--muted);line-height:1.4}
.cmp div b{display:block;font-size:20px;color:var(--ink);margin:4px 0}
.cmp div.g{border:2px solid var(--green)}
.cmp div.g b{color:var(--green)}
.map{position:relative;border-radius:18px;overflow:hidden}
.pulse{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid var(--red);animation:pl 1.6s ease-out infinite}
@keyframes pl{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
.msg.ai b{color:var(--red)}

.asr .hx{flex:1;font-size:15px;line-height:1.35}.asr .hx span{opacity:.85}
@media (max-height:820px){#jury{gap:8px}#jury p{display:none}#jury button{padding:8px 12px;font-size:13px}#jury .grp{margin-top:2px}}
/* v3: gerçek push geçişleri */
#scrHost{position:absolute;inset:0;overflow:hidden}
.scr.leaving{pointer-events:none}
.scr.in{z-index:2;animation:pushIn .38s cubic-bezier(.22,.8,.24,1) both;box-shadow:-14px 0 32px rgba(0,0,0,.14)}
.scr.out{z-index:1;animation:pushOut .38s cubic-bezier(.22,.8,.24,1) both}
.scr.inBack{z-index:1;animation:popIn .34s cubic-bezier(.22,.8,.24,1) both}
.scr.outBack{z-index:2;animation:popOut .34s cubic-bezier(.4,0,.6,1) both;box-shadow:-14px 0 32px rgba(0,0,0,.14)}
.scr.inFade{z-index:2;animation:fadeIn2 .26s ease both}
.scr.outFade{z-index:1;animation:fadeOut2 .26s ease both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none;filter:none}to{transform:translateX(-26%);filter:brightness(.9)}}
@keyframes popIn{from{transform:translateX(-26%);filter:brightness(.9)}to{transform:none;filter:none}}
@keyframes popOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes fadeIn2{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeOut2{from{opacity:1}to{opacity:0}}
#sheetWrap.closing{animation:fadeOut2 .23s ease both}
#sheetWrap.closing .sheet{animation:sheetDown .23s cubic-bezier(.4,0,1,1) both}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
.hh,.hh .sb{background:var(--red)}
.morebtn{display:block;width:100%;border:1.5px dashed #E4C9CA;background:#fff;color:var(--red);font:inherit;font-weight:600;font-size:15px;border-radius:16px;padding:13px;cursor:pointer}
.sec2{display:flex;align-items:baseline;justify-content:space-between}

.hbanner{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1.5px solid #BFE6CF;border-radius:18px;padding:12px 14px;cursor:pointer;font:inherit;text-align:left;color:var(--ink)}
.hbanner.w{border-color:#F5D27A;background:linear-gradient(135deg,#FFFBEF,#fff)}

.aibox.hwarn{border-color:#F5D27A;background:linear-gradient(135deg,#FFFBEF,#fff)}
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.htile{background:#fff;border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1.5px solid transparent;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}

.htile.hwarn .hi{background:#FFF1C9;color:#B07B00}
.htile .hl{font-size:12.5px;color:var(--muted)}
